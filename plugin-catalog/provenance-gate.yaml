name: provenance-gate
title: Provenance Gate
repo: https://github.com/simin-yuan/hermes-provenance-gate
sha: f85afd255abcbfa03a66adfa6a221fb0cff283ec
version: "0.1.6"
description: >-
  Flags memory and skill_manage writes that state a user decision ("the user decided ...", "用户决定 ...")
  without the user's own words: each such sentence needs a quote that appears verbatim in text the user
  typed in this session, shares key words with the decision and does not drop a negation. A patch is
  checked by the text it produces. Three modes — observe (the default: records a flagged write as
  would_block and leaves it alone; `hermes provenance-gate report` lists them), ask (hands it to the
  human-approval gate with a rule_key of provenance-gate:<reason>, so "always" covers one class of
  finding) and block (refuses the write and tells the model how to fix it). Follows the plugin verdict
  convention v0.1.1. Measured on an independent blind set of 133 lines: precision 1.000, recall 0.694.
  Ships `self_anchor`, a command-line helper that timestamps a published body with OpenTimestamps
  (sha256 over the exact bytes; it refuses to overwrite a body an existing proof covers, and it is the
  one part of this repository that uses the network — the public OpenTimestamps calendars).
  Disclosure — two hooks (pre_llm_call, pre_tool_call); keeps a local copy of the text the user types,
  with its sender_id and session link, and an evidence log of checked claims under
  plugin-data/provenance-gate (30-day default retention, `hermes provenance-gate purge`); reads
  MEMORY.md, USER.md and skill files to reproduce what a patch produces; no credentials; the hooks make
  no network calls and never ask for approval unless the mode is ask or block.
maintainer: simin-yuan
tier: community
category: general
requires_hermes: ">=0.22.2"
docs_url: https://github.com/simin-yuan/hermes-provenance-gate#readme
