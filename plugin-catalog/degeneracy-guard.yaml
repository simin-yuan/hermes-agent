name: degeneracy-guard
repo: https://github.com/simin-yuan/hermes-degeneracy-guard
sha: aa3b31017f7eec79587a6209d3bb829364d6d15c
version: "1.5.0"
description: Asks the user to confirm a tool call whose arguments look like a repetition loop rather than data, through Hermes' approval gate (denied or unanswered means refused); replaces flagged degenerate output with a short notice; warns when a session grows long. Modes — `DEGENERACY_GUARD_MODE=observe|act`, where a new install starts in `observe` (it records what it would have flagged and replaces nothing) and `act` turns on the replacement, the approval gate and the warning, while an install upgraded from an earlier version keeps `act`. `HERMES_GUARD_MODE` sets the mode for every plugin in the family that has one; the plugin's own key wins. Disclosure — no network, shell, subprocesses, own threads, telemetry or credentials; writes incident records and a session counter to its plugin data directory; a stream-side record keeps the last 800 characters of flagged output.
maintainer: simin-yuan
tier: community
category: general
requires_hermes: ">=0.22.2"
capabilities:
  provides_tools: []
  provides_hooks:
    - on_stream_delta
    - transform_llm_output
    - post_llm_call
    - pre_tool_call
    - pre_llm_call
  provides_middleware: []
  requires_env: []
